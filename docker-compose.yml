version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: almasfufa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-almasfufa}
      POSTGRES_USER: ${POSTGRES_USER:-almasfufa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-almasfufa_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-almasfufa} -d ${POSTGRES_DB:-almasfufa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: almasfufa-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
