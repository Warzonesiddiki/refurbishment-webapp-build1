services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tahir-erp-web
    restart: unless-stopped
    ports:
      - "${WEB_BIND_HOST:-0.0.0.0}:${WEB_PORT:-4173}:80"
    depends_on:
      java-api:
        condition: service_healthy

  java-api:
    build:
      context: .
      dockerfile: Dockerfile.java
    container_name: tahir-erp-java-api
    restart: unless-stopped
    environment:
      TAHIR_ALLOWED_ORIGIN: ${TAHIR_ALLOWED_ORIGIN:-*}
      TAHIR_TRUST_PRIVATE_NETWORK_ORIGINS: ${TAHIR_TRUST_PRIVATE_NETWORK_ORIGINS:-true}
      PORT: ${JAVA_API_PORT:-8085}
    ports:
      - "${JAVA_BIND_HOST:-0.0.0.0}:${JAVA_API_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: tahir-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tahir_erp}
      POSTGRES_USER: ${POSTGRES_USER:-tahir_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tahir_erp_dev}
    ports:
      - "${DB_BIND_HOST:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tahir_erp} -d ${POSTGRES_DB:-tahir_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: tahir-erp-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_BIND_HOST:-0.0.0.0}:${ADMINER_PORT:-8080}:8080"

volumes:
  postgres_data:
